{% extends 'base.html' %}

{% block title %}Add AC Brand{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Add AC Brand</h1>
            <p class="text-xs text-slate-500 mt-0.5">Register supported AC brand manufacturer in workshop system</p>
        </div>
        <a href="{% url 'inventory:brand_list' %}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>Cancel</span>
        </a>
    </div>

    <form method="POST" class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Brand Name *</label>
            <input type="text" name="name" required placeholder="e.g. LG, Daikin, Gree" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 text-slate-800">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Brand Code</label>
            <input type="text" name="code" placeholder="e.g. LG, DAI, SAM" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 text-slate-800 font-mono">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Description</label>
            <textarea name="description" rows="3" placeholder="Brand overview and spare part availability notes" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 text-slate-800"></textarea>
        </div>

        <div class="flex items-center gap-2">
            <input type="checkbox" name="is_common" id="is_common" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
            <label for="is_common" class="text-xs text-slate-700 font-medium">Mark as Universal / Common (generic parts usable across all AC brands)</label>
        </div>

        <div class="pt-3 flex justify-end">
            <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow-md shadow-blue-600/30 transition-all">
                Save Brand
            </button>
        </div>
    </form>
</div>
{% endblock %}
