{% extends 'base.html' %}

{% block title %}{{ action }} Customer Record{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">{{ action }} Customer Profile</h1>
            <p class="text-xs text-slate-500 mt-0.5">Register customer contact details and workshop address</p>
        </div>
        <a href="{% url 'customers:customer_list' %}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>Cancel</span>
        </a>
    </div>

    <form method="POST" class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Full Name *</label>
            <input type="text" name="name" value="{{ customer.name|default:'' }}" required placeholder="e.g. Ram Kumar" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 text-slate-800">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Primary Phone Number *</label>
                <input type="text" name="phone" value="{{ customer.phone|default:'' }}" required placeholder="e.g. 9841XXXXXX" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 text-slate-800 font-mono">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Alternate Phone</label>
                <input type="text" name="alt_phone" value="{{ customer.alt_phone|default:'' }}" placeholder="e.g. 056-52XXXX" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 text-slate-800 font-mono">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Address / Ward *</label>
            <input type="text" name="address" value="{{ customer.address|default:workshop.address|default:'' }}" required placeholder="e.g. Ward / Street Location" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 text-slate-800">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Landmark / Directions</label>
            <input type="text" name="landmark" value="{{ customer.landmark|default:'' }}" placeholder="e.g. Near Chaubiskothi, Behind Bank" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 text-slate-800">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Special Notes</label>
            <textarea name="notes" rows="3" placeholder="Customer preferences or location notes" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 text-slate-800">{{ customer.notes|default:'' }}</textarea>
        </div>

        <div class="pt-4 flex justify-end gap-2">
            <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow-md shadow-blue-600/30 transition-all">
                Save Customer Record
            </button>
        </div>
    </form>
</div>
{% endblock %}
